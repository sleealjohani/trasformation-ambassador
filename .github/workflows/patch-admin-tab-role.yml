name: Patch admin tab role

on:
  push:
    branches: [feat/ambassador-control-center]
    paths:
      - ".github/workflows/patch-admin-tab-role.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ambassador-control-center
      - name: Align privacy test with ARIA tabs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/privacy.spec.ts')
          text = path.read_text()
          old = 'getByRole("button", { name: "صندوق العمل", exact: true })'
          new = 'getByRole("tab", { name: "صندوق العمل", exact: true })'
          if old not in text:
              raise SystemExit('privacy tab anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/patch-admin-tab-role.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/privacy.spec.ts
          git commit -m "test(admin): query privacy control navigation as tab"
          git push origin HEAD:feat/ambassador-control-center
