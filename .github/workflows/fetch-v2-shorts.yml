name: Fetch V2 Shorts

on:
  push:
    branches:
      - feat/v2-mobile-listening

permissions:
  contents: write

concurrency:
  group: fetch-v2-shorts
  cancel-in-progress: true

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-mobile-listening
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install download helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 yt-dlp
          ffmpeg -version | head -n 1

      - name: Download and optimize official shorts
        run: python scripts/download-v2-shorts.py

      - name: Commit local video copies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media src/content/official.ts
          if git diff --cached --quiet; then
            echo "Shorts already present; nothing to commit."
            exit 0
          fi
          git commit -m "feat(v2): store official shorts locally"
          git push origin HEAD:feat/v2-mobile-listening
