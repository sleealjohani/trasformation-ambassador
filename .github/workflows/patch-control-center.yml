name: Patch control center cleanup

on:
  push:
    branches: [feat/ambassador-control-center]
    paths:
      - ".github/workflows/patch-control-center.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ambassador-control-center
      - name: Apply focused fixes
        run: |
          node <<'NODE'
          const fs = require('fs');
          const contentPath = 'src/components/app/AdminContentManager.tsx';
          let content = fs.readFileSync(contentPath, 'utf8');
          content = content.replace('const headers = rows[0].map((item) => item.toLowerCase());', 'const headers = (rows[0] ?? []).map((item) => item.toLowerCase());');
          fs.writeFileSync(contentPath, content);

          const serverPath = 'src/server/control-center.ts';
          let server = fs.readFileSync(serverPath, 'utf8');
          server = server.replace('import { OFFICIAL_SHORTS } from "@/content/official";\n', '');
          server = server.replace(/async function ensureDefaultMedia\(\): Promise<void> \{[\s\S]*?\n\}\n\nexport async function listPublishedMedia/, 'export async function listPublishedMedia');
          server = server.replaceAll('  await ensureDefaultMedia();\n', '');
          fs.writeFileSync(serverPath, server);
          NODE
      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/patch-control-center.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/app/AdminContentManager.tsx src/server/control-center.ts
          git commit -m "fix(admin): harden content import and media ownership"
          git push origin HEAD:feat/ambassador-control-center
