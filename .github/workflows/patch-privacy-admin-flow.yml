name: Patch admin privacy flow

on:
  push:
    branches: [feat/ambassador-control-center]
    paths:
      - ".github/workflows/patch-privacy-admin-flow.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ambassador-control-center
      - name: Update privacy E2E navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/privacy.spec.ts')
          text = path.read_text()
          needle = 'await page.goto("/admin/login"); await page.getByLabel("رمز الدخول").fill(PASSCODE); await page.getByRole("button", { name: "دخول" }).click(); await expect(page).toHaveURL(/\\/admin$/);\n  const inbox'
          replacement = 'await page.goto("/admin/login"); await page.getByLabel("رمز الدخول").fill(PASSCODE); await page.getByRole("button", { name: "دخول" }).click(); await expect(page).toHaveURL(/\\/admin$/);\n  await page.getByRole("button", { name: "صندوق العمل", exact: true }).click();\n  const inbox'
          if needle not in text:
              raise SystemExit('privacy flow anchor not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          git rm .github/workflows/patch-privacy-admin-flow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/privacy.spec.ts
          git commit -m "test(admin): follow control center privacy flow"
          git push origin HEAD:feat/ambassador-control-center
