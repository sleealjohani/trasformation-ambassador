<!doctype html>
<!--
  خلفية غلاف البطاقة — تُخبَز صورةً واحدة بدقة ٣٠٠dpi ثم تُموَّه نسخةٌ منها للزجاج.
  الطبقات بترتيب العمق في الهوية: مكان ← إضاءة ← جسر. الزجاج والنص فوقها في question-card.html.
  المقاس: نصف A4 أفقي + نزف ٣مم من الأعلى والأسفل والحافة الخارجية = 151.5 × 216 مم.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Cover bake</title>
<style>
  html, body { margin: 0; }
  html { overflow: hidden; } /* فيضان الجسر في صفحة RTL يُزيح أصل لقطة الشاشة */
  body {
    position: relative; overflow: hidden;
    inline-size: 151.5mm; block-size: 216mm;
    background: #103F4B;
  }
  .layer { position: absolute; inset: 0; }

  /* ١ · المكان: المستشفى نفسه، بخريطة تدرّج من ألوان اللوحة، ضبابيًا كخلفية الموقع */
  .place { inline-size: 100%; block-size: 100%; display: block; }
  /* نسخة الزجاج: المشهد نفسه بتمويه أعمق، تُحاذى تحت كل لوح في البطاقة */
  .frost-mode .stage { filter: blur(1.7mm) saturate(1.25) brightness(1.12); }
  .stage { position: absolute; inset: 0; overflow: hidden; }

  /* تظليل يحمي النص: أعمق تحت العنوان وتحت الخطوات، وأخفّ حيث يقف الجسر */
  .shade {
    background: linear-gradient(180deg,
      rgb(16 63 75 / .80) 0%,
      rgb(16 63 75 / .74) 34%,
      rgb(16 63 75 / .38) 50%,
      rgb(16 63 75 / .46) 64%,
      rgb(16 63 75 / .86) 80%,
      rgb(13 52 62 / .94) 100%);
  }

  /* ٢ · الإضاءة: ضوء أخضر الهوية خلف الجسر */
  .light {
    background:
      radial-gradient(ellipse 58% 20% at 46% 58%, rgb(4 166 122 / .42), transparent 72%),
      radial-gradient(ellipse 40% 14% at 62% 52%, rgb(158 204 59 / .16), transparent 70%);
  }

  /* ٣ · الجسر: نقش الهوية، يعبر الغلاف من حافة إلى حافة */
  .bridge { position: absolute; inset-inline: -12mm; inset-block-start: 107mm; block-size: 44mm; }
  .bridge svg { inline-size: 100%; block-size: 100%; overflow: visible; }
  .bridge .glow { filter: blur(2.2mm); opacity: .75; }
</style>
</head>
<body>
<div class="stage">
  <canvas class="layer place" width="1789" height="2551"></canvas>
  <div class="layer shade"></div>
  <div class="layer light"></div>
  <div class="bridge">
    <svg viewBox="0 0 438 222" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="arc" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#04A67A" stop-opacity=".35"/>
          <stop offset=".45" stop-color="#9ECC3B"/>
          <stop offset=".6" stop-color="#9ECC3B"/>
          <stop offset="1" stop-color="#04A67A" stop-opacity=".35"/>
        </linearGradient>
      </defs>
      <g class="glow" fill="none" stroke="#04A67A" stroke-width="5" vector-effect="non-scaling-stroke">
        <path d="M0 206C94 206 92 0 214 0S344 206 438 206" vector-effect="non-scaling-stroke"/>
      </g>
      <g fill="none" stroke="url(#arc)" stroke-linecap="round">
        <path d="M0 206C94 206 92 0 214 0S344 206 438 206" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
        <path d="M0 222C110 222 108 16 214 16S328 222 438 222" stroke-width="1.3" stroke-opacity=".7" vector-effect="non-scaling-stroke"/>
      </g>
    </svg>
  </div>
</div>
<script>
  // المصدر: صورة المستشفى في public/brand/scene.webp (1600×881). تُقصّ عمودية حول المدخل
  // ثم تُحوَّل درجاتها إلى خريطة من ألوان اللوحة: حبر ← ليلي ← أساس نشط ← أساس عند التمرير.
  const STOPS = ["#12353F", "#103F4B", "#034B5D", "#045E74"];
  const CROP = { x: 463, y: 0, w: 618, h: 881 };
  const LEVEL = { lo: 0.30, hi: 0.96 };
  const BLUR_PX = 8;

  const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const stops = STOPS.map(rgb);
  const lut = Array.from({ length: 256 }, (_, i) => {
    const t = (i / 255) * (stops.length - 1), k = Math.min(Math.floor(t), stops.length - 2), f = t - k;
    return stops[k].map((c, j) => Math.round(c + (stops[k + 1][j] - c) * f));
  });

  window.bakeReady = new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const cv = document.querySelector(".place"), ctx = cv.getContext("2d");
      ctx.filter = `blur(${BLUR_PX}px)`;
      ctx.drawImage(img, CROP.x, CROP.y, CROP.w, CROP.h, -20, -20, cv.width + 40, cv.height + 40);
      ctx.filter = "none";
      const d = ctx.getImageData(0, 0, cv.width, cv.height), px = d.data;
      for (let i = 0; i < px.length; i += 4) {
        const l = (0.2126 * px[i] + 0.7152 * px[i + 1] + 0.0722 * px[i + 2]) / 255;
        const t = Math.min(1, Math.max(0, (l - LEVEL.lo) / (LEVEL.hi - LEVEL.lo)));
        const [r, g, b] = lut[Math.round(t * 255)];
        px[i] = r; px[i + 1] = g; px[i + 2] = b;
      }
      ctx.putImageData(d, 0, 0);
      resolve(true);
    };
    img.src = "../../public/brand/scene.webp";
  });
</script>
</body>
</html>
